name: Build GuitarSim Apple Silicon VST3
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Configure Apple Silicon (M2 and later)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test DSP, state and editor
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test signing and installation script
        run: |
          GUITARSIM_INSTALL_DIR="$RUNNER_TEMP/guitarsim-test-vst3" bash scripts/build-sign-install-mac.sh --install-only "$PWD/build/GuitarSim_artefacts/Release/VST3/GuitarSim.vst3"
          codesign --verify --deep --strict "$RUNNER_TEMP/guitarsim-test-vst3/GuitarSim.vst3"
      - name: Render interface previews
        run: build/plugin_checks "$PWD/build/previews"
      - name: Sign and archive
        run: |
          codesign --force --deep --sign - "build/GuitarSim_artefacts/Release/VST3/GuitarSim.vst3"
          ditto -c -k --sequesterRsrc --keepParent "build/GuitarSim_artefacts/Release/VST3/GuitarSim.vst3" GuitarSim-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GuitarSim-macOS-arm64
          path: GuitarSim-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GuitarSim-UI-previews
          path: build/previews/*.png
